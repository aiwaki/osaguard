[package]
name = "osaguard-tray"
version = "0.1.0"
description = "OsaGuard menu-bar app and first-run setup"
authors = ["aiwaki"]
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/aiwaki/osaguard"
homepage = "https://github.com/aiwaki/osaguard"
readme = "../README.md"

[lib]
name = "osaguard_tray_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
libc = "0.2"
plist = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["time"] }
trash = { version = "5", default-features = false }

[profile.release]
opt-level = "s"
lto = true
strip = true
