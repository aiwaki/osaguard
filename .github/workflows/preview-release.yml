name: Publish macOS preview

on:
  workflow_dispatch:
    inputs:
      preview:
        description: Exact preview sequence to publish from main (currently 1)
        required: true
        default: "1"
        type: string

permissions:
  actions: read
  contents: write
  attestations: write
  id-token: write

concurrency:
  group: osaguard-preview-release
  cancel-in-progress: false

# This is intentionally a preview-only path, modelled on Slipstream's preview
# releases. It imports one persistent self-signed code-signing identity into a
# disposable runner Keychain. This provides a stable macOS code requirement but
# does not provide Developer ID trust, Gatekeeper acceptance, or notarization.
jobs:
  publish-preview:
    name: Build and publish Apple Silicon preview
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Require a main dispatch and the authorized preview sequence
        env:
          PREVIEW: ${{ inputs.preview }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]] || {
            echo "Preview releases must be dispatched from main" >&2
            exit 1
          }
          [[ "$PREVIEW" == 1 ]] || {
            echo "The current source only authorizes preview sequence 1" >&2
            exit 1
          }

      - name: Check out immutable main source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: app-tauri/package-lock.json

      - name: Resolve exact preview identity
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW: ${{ inputs.preview }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./app-tauri/package.json').version")
          [[ "$version" == "0.1.3-preview.${PREVIEW}" ]] || {
            echo "Preview ${PREVIEW} must package canonical version 0.1.3-preview.${PREVIEW}; found $version" >&2
            exit 1
          }
          tag="v${version}"
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          existing_tag=$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/$tag" \
            --jq "[.[] | select(.ref == \"refs/tags/$tag\")] | length")
          existing_release=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$tag\") | .id")
          [[ "$existing_tag" == 0 && -z "$existing_release" ]] || {
            echo "Preview tag or release already exists: $tag" >&2
            exit 1
          }
          {
            echo "version=$version"
            echo "preview=$PREVIEW"
            echo "tag=$tag"
            echo "commit=$GITHUB_SHA"
          } >> "$GITHUB_OUTPUT"
      - name: Require a successful exact-main CI run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&event=push&status=completed&per_page=100" \
            --jq ".workflow_runs[] | select(.head_sha == \"$GITHUB_SHA\") | select(.conclusion == \"success\") | .id" \
            | sed -n '1p')
          [[ "$run_id" =~ ^[1-9][0-9]*$ ]] || {
            echo "No successful CI run exists for $GITHUB_SHA" >&2
            exit 1
          }
          run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$run_id")
          python3 -c '
          import json, sys
          run = json.load(sys.stdin)
          expected_sha, repository = sys.argv[1:]
          expected = {
              "head_sha": expected_sha,
              "head_branch": "main",
              "event": "push",
              "conclusion": "success",
              "path": ".github/workflows/ci.yml",
          }
          for key, value in expected.items():
              if run.get(key) != value:
                  raise SystemExit(f"CI run has invalid {key}: {run.get(key)!r}")
          if (run.get("head_repository") or {}).get("full_name") != repository:
              raise SystemExit("CI run belongs to a different repository")
          ' "$GITHUB_SHA" "$GITHUB_REPOSITORY" <<< "$run"

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1d1eb14921d9c2d8ea575663e5fe3a0b57868a05 # 1.89.0
        with:
          components: clippy,rustfmt
          targets: aarch64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app-tauri/src-tauri

      - name: Install frontend dependencies
        working-directory: app-tauri
        run: npm ci

      - name: Validate source before loading signing secrets
        working-directory: app-tauri
        env:
          OSAGUARD_PREVIEW_SEQUENCE: ${{ inputs.preview }}
        shell: bash
        run: |
          set -euo pipefail
          node ../scripts/check-release-version.mjs
          npm test

      - name: Import the persistent preview signing identity
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${APPLE_CERTIFICATE:?APPLE_CERTIFICATE is required}"
          : "${APPLE_CERTIFICATE_PASSWORD:?APPLE_CERTIFICATE_PASSWORD is required}"
          readonly signing_identity='OsaGuard Preview Code Signing'
          readonly expected_sha256='a6cf1f0bc828d93e7b4f0fbc87a5163968acd7499decbfb29314ecd76db92c52'
          readonly expected_sha1='894700cbb7d156943c872afab16ed609ca1f43e4'
          pinned_certificate="$GITHUB_WORKSPACE/docs/release-signing/osaguard-preview-code-signing.pem"
          pinned_der="$RUNNER_TEMP/osaguard-preview-pinned.der"
          imported_der="$RUNNER_TEMP/osaguard-preview-imported.der"
          [[ -f "$pinned_certificate" ]]
          /usr/bin/openssl x509 -in "$pinned_certificate" -outform DER -out "$pinned_der"
          pinned_sha256=$(/usr/bin/shasum -a 256 "$pinned_der" | /usr/bin/awk '{print $1}')
          pinned_sha1=$(/usr/bin/openssl x509 -in "$pinned_certificate" -noout -fingerprint -sha1 \
            | /usr/bin/sed 's/^.*=//' \
            | /usr/bin/tr -d ':' \
            | /usr/bin/tr '[:upper:]' '[:lower:]')
          [[ "$pinned_sha256" == "$expected_sha256" && "$pinned_sha1" == "$expected_sha1" ]] || {
            echo "Committed preview certificate does not match the pinned fingerprints" >&2
            exit 1
          }
          keychain="$RUNNER_TEMP/osaguard-preview-signing.keychain-db"
          certificate="$RUNNER_TEMP/osaguard-preview-signing.p12"
          keychain_password="$(/usr/bin/uuidgen)$(/usr/bin/uuidgen)"
          echo "::add-mask::$keychain_password"
          printf '%s' "$APPLE_CERTIFICATE" | /usr/bin/base64 --decode > "$certificate"
          /bin/chmod 600 "$certificate"
          /usr/bin/security create-keychain -p "$keychain_password" "$keychain"
          /usr/bin/security set-keychain-settings -lut 21600 "$keychain"
          /usr/bin/security unlock-keychain -p "$keychain_password" "$keychain"
          /usr/bin/security import "$certificate" \
            -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          /usr/bin/security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain" >/dev/null
          /usr/bin/security list-keychains -d user -s "$keychain"
          identity_count=$(/usr/bin/security find-identity -p codesigning "$keychain" \
            | /usr/bin/grep -F -c "\"$signing_identity\"" || true)
          [[ "$identity_count" == 1 ]] || {
            echo "Expected exactly one configured preview signing identity" >&2
            exit 1
          }
          /usr/bin/security find-certificate \
            -c "$signing_identity" \
            -p \
            "$keychain" > "$RUNNER_TEMP/osaguard-preview-signing.pem"
          /usr/bin/openssl x509 \
            -in "$RUNNER_TEMP/osaguard-preview-signing.pem" \
            -outform DER \
            -out "$imported_der"
          /usr/bin/cmp -s "$pinned_der" "$imported_der" || {
            echo "Imported preview signing certificate does not match the committed certificate" >&2
            exit 1
          }
          cert_sha1=$(/usr/bin/openssl x509 \
            -in "$RUNNER_TEMP/osaguard-preview-signing.pem" \
            -noout \
            -fingerprint \
            -sha1 \
            | /usr/bin/sed 's/^.*=//' \
            | /usr/bin/tr -d ':' \
            | /usr/bin/tr '[:upper:]' '[:lower:]')
          [[ "$cert_sha1" =~ ^[0-9a-f]{40}$ ]]
          [[ "$cert_sha1" == "$expected_sha1" ]]
          {
            echo "OSAGUARD_SIGNING_KEYCHAIN=$keychain"
            echo "OSAGUARD_SIGNING_CERTIFICATE=$certificate"
            echo "OSAGUARD_CERT_SHA1=$cert_sha1"
          } >> "$GITHUB_ENV"

      - name: Build preview artifacts
        working-directory: app-tauri
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${TAURI_SIGNING_PRIVATE_KEY:?TAURI_SIGNING_PRIVATE_KEY is required}"
          : "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:?TAURI_SIGNING_PRIVATE_KEY_PASSWORD is required}"
          node ../scripts/configure-preview-updater.mjs
          npm run build:updater

          bundle_directory=src-tauri/target/aarch64-apple-darwin/release/bundle
          disk_images=()
          while IFS= read -r disk_image; do
            disk_images+=("$disk_image")
          done < <(/usr/bin/find "$bundle_directory" -type f -name '*.dmg' -print)
          [[ ${#disk_images[@]} == 1 ]] || {
            echo "Expected exactly one DMG, found ${#disk_images[@]}" >&2
            exit 1
          }
          app_bundle="$bundle_directory/macos/OsaGuard.app"
          [[ -d "$app_bundle" ]] || {
            echo "Expected app bundle is missing" >&2
            exit 1
          }
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$app_bundle"
          stable_requirement="identifier \"dev.aiwaki.osaguard\" and certificate leaf = H\"${OSAGUARD_CERT_SHA1}\""
          /usr/bin/codesign --verify \
            --deep \
            --strict \
            --verbose=2 \
            -R="$stable_requirement" \
            "$app_bundle"
          /usr/bin/codesign -d -r- "$app_bundle"
          app_executables=("$app_bundle"/Contents/MacOS/*)
          [[ ${#app_executables[@]} == 1 && -f "${app_executables[0]}" ]] || {
            echo "Expected exactly one application executable" >&2
            exit 1
          }
          [[ "$(/usr/bin/lipo -archs "${app_executables[0]}")" == arm64 ]] || {
            echo "Preview artifact is not Apple Silicon only" >&2
            exit 1
          }

          release_dir=release-assets
          /bin/mkdir "$release_dir"
          asset_prefix="OsaGuard_${{ steps.release.outputs.version }}_aarch64"
          /bin/cp "${disk_images[0]}" "$release_dir/${asset_prefix}.dmg"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
            "$app_bundle" "$release_dir/${asset_prefix}.zip"
          updater_archives=()
          while IFS= read -r updater_archive; do
            updater_archives+=("$updater_archive")
          done < <(/usr/bin/find "$bundle_directory" -type f -name '*.app.tar.gz' -print)
          [[ ${#updater_archives[@]} == 1 ]] || {
            echo "Expected exactly one updater archive, found ${#updater_archives[@]}" >&2
            exit 1
          }
          [[ -s "${updater_archives[0]}.sig" ]] || {
            echo "Updater signature is missing" >&2
            exit 1
          }
          /bin/cp "${updater_archives[0]}" "$release_dir/OsaGuard.app.tar.gz"
          /bin/cp "${updater_archives[0]}.sig" "$release_dir/OsaGuard.app.tar.gz.sig"
          node ../scripts/generate-preview-release-metadata.mjs \
            "$release_dir" \
            "${{ steps.release.outputs.tag }}" \
            "$GITHUB_REPOSITORY"
          node ../scripts/verify-updater-signature.mjs \
            "$release_dir/OsaGuard.app.tar.gz" \
            "$release_dir/OsaGuard.app.tar.gz.sig"
          (
            cd "$release_dir"
            /usr/bin/shasum -a 256 \
              "${asset_prefix}.dmg" \
              "${asset_prefix}.zip" \
              OsaGuard.app.tar.gz \
              OsaGuard.app.tar.gz.sig \
              latest.json > SHA256SUMS
          )

      - name: Remove the disposable signing Keychain
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          keychain="${OSAGUARD_SIGNING_KEYCHAIN:-$RUNNER_TEMP/osaguard-preview-signing.keychain-db}"
          certificate="${OSAGUARD_SIGNING_CERTIFICATE:-$RUNNER_TEMP/osaguard-preview-signing.p12}"
          if [[ -f "$keychain" ]]; then
            /usr/bin/security delete-keychain "$keychain" || true
          fi
          /bin/rm -f "$certificate"
          /bin/rm -f "$RUNNER_TEMP/osaguard-preview-signing.pem"
          /bin/rm -f \
            "$RUNNER_TEMP/osaguard-preview-pinned.der" \
            "$RUNNER_TEMP/osaguard-preview-imported.der"

      - name: Attest preview artifacts
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: app-tauri/release-assets/*

      - name: Create and validate the exact preview draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
          RELEASE_PREVIEW: ${{ steps.release.outputs.preview }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          notes="$RUNNER_TEMP/osaguard-preview-notes.md"
          {
            printf '%s\n\n' "OsaGuard ${RELEASE_VERSION} — Preview ${RELEASE_PREVIEW}"
            printf '%s\n\n' 'Предварительная сборка для Apple Silicon. Это не stable-канал и не нотариально заверенная Apple сборка.'
            printf '%s\n\n' 'Preview build for Apple Silicon. This is not the stable channel and is not notarized by Apple.'
            printf '%s\n\n' 'Первый updater-capable preview: 0.1.2 обновляется на него вручную; последующие preview рассчитаны на автоматическое обнаружение и устанавливаются только после подтверждения. First updater-capable preview: install it manually over 0.1.2; later previews are designed for automatic discovery and install only after confirmation.'
            printf '%s\n' '## Установка / Installation'
            printf '%s\n' "- Скачайте \`OsaGuard_${RELEASE_VERSION}_aarch64.dmg\`, перенесите OsaGuard в «Программы» и запускайте только из этой папки. / Download \`OsaGuard_${RELEASE_VERSION}_aarch64.dmg\`, move OsaGuard to Applications, and run it only from there."
            printf '%s\n' '- macOS может предупредить, что приложение не нотариально. Не отключайте Gatekeeper глобально; после первой отклонённой попытки откройте «Системные настройки» → «Конфиденциальность и безопасность» → «Всё равно открыть» только если доверяете этому exact preview. Контекстное меню Finder → «Открыть» — альтернатива. / macOS may warn because the app is not notarized. Do not disable Gatekeeper globally; after the first blocked launch, use System Settings → Privacy & Security → Open Anyway only if you trust this exact preview. Finder contextual Open is an alternative.'
            printf '%s\n' '- Preview использует отдельную постоянную подпись приложения и Tauri updater-архивов, но это не Apple Developer ID и не нотарификация. / The preview uses persistent app and Tauri updater signing identities, but neither is Apple Developer ID or notarization.'
            printf '%s\n' '- Эта ручная bridge-установка создаёт свежие v2-записи Связки ключей: пароль нужно ввести один раз. Старые preview-записи намеренно не читаются и не изменяются. / This manual bridge creates fresh v2 Keychain records, so enter the password once. Legacy preview records are intentionally neither read nor modified.'
            printf '%s\n' '- Cancel при смене пароля ничего не меняет; в меню добавлено безопасное встроенное удаление OsaGuard. / Canceling a password change changes nothing; the menu now includes a built-in OsaGuard uninstaller.'
            printf '%s\n\n' '## Критическое предупреждение / Critical warning'
            printf '%s\n\n' 'После настройки OsaGuard может автоматически отправить пароль администратора в подходящее окно AppleScript. Код, уже запущенный от вашего пользователя, может этим получить root без нового ручного подтверждения. After setup, OsaGuard can automatically submit an administrator password to a matching AppleScript dialog. Code already running as your user can thereby obtain root without a new manual confirmation.'
            printf '%s\n' "Source commit: ${RELEASE_COMMIT}"
          } > "$notes"

          release_id=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
            -f tag_name="$RELEASE_TAG" \
            -f target_commitish="$RELEASE_COMMIT" \
            -f name="OsaGuard ${RELEASE_VERSION} (Preview ${RELEASE_PREVIEW})" \
            -f body="$(< "$notes")" \
            -F draft=true \
            -F prerelease=true \
            -f make_latest=false \
            --jq '.id')
          [[ "$release_id" =~ ^[1-9][0-9]*$ ]]
          for asset in app-tauri/release-assets/*; do
            asset_name=$(basename "$asset")
            [[ "$asset_name" =~ ^[A-Za-z0-9._-]+$ && -s "$asset" ]] || {
              echo "Unsafe or empty preview asset: $asset_name" >&2
              exit 1
            }
            /usr/bin/curl --fail --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --header "Content-Type: application/octet-stream" \
              --data-binary "@$asset" \
              "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?name=${asset_name}" \
              > "$RUNNER_TEMP/osaguard-upload-${asset_name}.json"
          done

          api="repos/${GITHUB_REPOSITORY}/releases/${release_id}"
          [[ "$(gh api "$api" --jq '.tag_name')" == "$RELEASE_TAG" ]]
          [[ "$(gh api "$api" --jq '.target_commitish')" == "$RELEASE_COMMIT" ]]
          [[ "$(gh api "$api" --jq '.draft')" == true ]]
          [[ "$(gh api "$api" --jq '.prerelease')" == true ]]
          expected_assets=$(printf '%s\n' \
            "OsaGuard_${RELEASE_VERSION}_aarch64.dmg" \
            "OsaGuard_${RELEASE_VERSION}_aarch64.zip" \
            OsaGuard.app.tar.gz \
            OsaGuard.app.tar.gz.sig \
            latest.json \
            SHA256SUMS | LC_ALL=C sort)
          actual_assets=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" \
            --jq '.[].name' | LC_ALL=C sort)
          [[ "$actual_assets" == "$expected_assets" ]] || {
            echo "Unexpected preview asset set" >&2
            exit 1
          }

          [[ "$(gh api "$api" --jq '.make_latest')" != true ]]
          {
            echo "Validated draft release ${RELEASE_TAG} (id ${release_id})."
            echo "Inspect its assets and publish it manually as a prerelease with Latest disabled."
          } >> "$GITHUB_STEP_SUMMARY"
