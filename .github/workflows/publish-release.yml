name: Publish qualified release (blocked)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Reserved for the future Apple-signed release workflow
        required: true
        type: string
      publish_acknowledgement:
        description: Reserved for the future Apple-signed release workflow
        required: true
        type: string

permissions:
  contents: read

# This second gate deliberately remains closed with the build gate. It prevents
# an old draft from being made public before a real Apple-signed release exists.
jobs:
  stable-publication-disabled:
    name: Keep incomplete stable publication closed
    runs-on: ubuntu-latest
    steps:
      - name: Explain the publication gate
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::Stable binary publication is disabled until an Apple-signed, notarized, and stapled OsaGuard release has passed qualification."
          exit 1
