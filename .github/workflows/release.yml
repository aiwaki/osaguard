name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional version override; must match app metadata
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-stable
  cancel-in-progress: false

# Required repository secrets: TAURI_SIGNING_PRIVATE_KEY,
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD, OSAGUARD_CODE_SIGNING_P12_BASE64, and
# OSAGUARD_CODE_SIGNING_P12_PASSWORD. The private keys and passwords must never
# be committed or printed. Required non-secret repository variables:
# OSAGUARD_UPDATER_PUBLIC_KEY and OSAGUARD_CODE_SIGNING_CERTIFICATE_SHA256. No
# Apple Developer ID or notarization credential is used for these builds.

jobs:
  verify:
    name: Verify release source
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      release_commit: ${{ steps.release.outputs.commit }}
      release_tag: ${{ steps.release.outputs.tag }}
      release_version: ${{ steps.release.outputs.version }}

    steps:
      - name: Require a manual run from main
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]] || {
            echo "Releases must be dispatched from main" >&2
            exit 1
          }

      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Resolve immutable release identity
        id: release
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./app-tauri/package.json').version")
          if [[ -n "$REQUESTED_VERSION" && "$REQUESTED_VERSION" != "$version" ]]; then
            echo "Requested version $REQUESTED_VERSION does not match $version" >&2
            exit 1
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          commit=$(git rev-parse HEAD)
          [[ "$commit" == "$GITHUB_SHA" ]]
          {
            echo "version=$version"
            echo "tag=v${version}"
            echo "commit=$commit"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: app-tauri/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1d1eb14921d9c2d8ea575663e5fe3a0b57868a05 # 1.89.0
        with:
          components: clippy,rustfmt
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app-tauri/src-tauri

      - name: Install frontend dependencies
        working-directory: app-tauri
        run: npm ci

      - name: Verify version metadata
        run: node scripts/check-release-version.mjs

      - name: Require immutable action pins
        run: node scripts/check-action-pins.mjs

      - name: Test frontend state and release tooling
        working-directory: app-tauri
        run: npm test

      - name: Audit npm dependencies
        working-directory: app-tauri
        run: npm audit --audit-level=high

      - name: Test and vet Go code
        run: |
          go test -race ./...
          go vet ./...

      - name: Test and lint Rust code
        working-directory: app-tauri/src-tauri
        run: |
          cargo fmt --all -- --check
          cargo test --locked
          cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Validate updater signing configuration
        working-directory: app-tauri
        env:
          OSAGUARD_UPDATER_PUBLIC_KEY: ${{ vars.OSAGUARD_UPDATER_PUBLIC_KEY }}
        run: npm run prepare:release-config -- aarch64-apple-darwin

  prepare-release:
    name: Create clean stable draft
    needs: verify
    runs-on: macos-14
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}

    steps:
      - name: Create unique stable draft
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.verify.outputs.release_commit }}
          RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.verify.outputs.release_version }}
        shell: bash
        run: |
          set -euo pipefail
          readme_ru="https://github.com/${GITHUB_REPOSITORY}/blob/${RELEASE_COMMIT}/README.md"
          readme_en="https://github.com/${GITHUB_REPOSITORY}/blob/${RELEASE_COMMIT}/README.en.md"
          generated_notes=$(gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$RELEASE_TAG" \
            -f target_commitish="$RELEASE_COMMIT" \
            --jq '.body')
          release_preface=$(printf '%s\n' \
            '## Перед установкой / Before installing' \
            '' \
            '**Критически важно:** OsaGuard автоматически отправляет пароль администратора. Любой код, уже запущенный от вашего пользователя, может вызвать подходящий AppleScript-запрос и получить root без нового подтверждения.' \
            '' \
            '**Critical security warning:** OsaGuard automatically submits an administrator password. Any code already running as your user can create a matching AppleScript request and obtain root without another confirmation.' \
            '' \
            "Прочитайте [README](${readme_ru}) до установки. Read the [English README](${readme_en}) before installing." \
            '' \
            '### Установка / Installation' \
            '' \
            "- Apple Silicon: OsaGuard_${RELEASE_VERSION}_aarch64.dmg" \
            "- Intel: OsaGuard_${RELEASE_VERSION}_x64.dmg" \
            '- Перетащите OsaGuard в «Программы». Drag OsaGuard into Applications.' \
            '- Сборка подписана постоянным самоподписанным сертификатом OsaGuard, который не выдан Apple; приложение не нотариально заверено Apple. This build uses the permanent OsaGuard self-signed certificate, which is not Apple-issued; the app is not notarized by Apple.' \
            '- При первом запуске нажмите приложение правой кнопкой в Finder, выберите «Открыть» и подтвердите «Открыть». On first launch, right-click the app in Finder, choose Open, then confirm Open.' \
            '- Постоянный сертификат и designated requirement предназначены для сохранения идентичности между обновлениями; при смене сертификата macOS потребует заново выдать Accessibility и сохранить пароль. The permanent certificate and designated requirement preserve update identity; certificate rotation requires granting Accessibility and saving the password again.' \
            '- Новая установка выполняется вручную. Следующие стабильные версии доступны через подписанный Tauri updater. A fresh installation is manual; later stable versions are available through the signed Tauri updater.' \
            '' \
            "Source commit: ${RELEASE_COMMIT}")
          release_body=$(printf '%s\n\n%s\n' "$release_preface" "$generated_notes")

          existing_ids=()
          while IFS= read -r existing_id; do
            [[ -n "$existing_id" ]] && existing_ids+=("$existing_id")
          done < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .id")
          [[ ${#existing_ids[@]} -le 1 ]] || {
            echo "Multiple releases unexpectedly use $RELEASE_TAG" >&2
            exit 1
          }

          if [[ ${#existing_ids[@]} -eq 1 ]]; then
            release_id=${existing_ids[0]}
            existing_api="repos/${GITHUB_REPOSITORY}/releases/${release_id}"
            existing_draft=$(gh api "$existing_api" --jq '.draft')
            existing_prerelease=$(gh api "$existing_api" --jq '.prerelease')
            existing_target=$(gh api "$existing_api" --jq '.target_commitish')
            if [[ "$existing_draft" != true || "$existing_prerelease" != false || \
                  "$existing_target" != "$RELEASE_COMMIT" ]]; then
              echo "$RELEASE_TAG exists but is not the exact unpublished stable draft for $RELEASE_COMMIT" >&2
              exit 1
            fi

            while IFS= read -r asset_id; do
              [[ -n "$asset_id" ]] || continue
              gh api --method DELETE \
                "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
            done < <(gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" \
              --jq '.[].id')
            [[ "$(gh api "$existing_api" --jq '.assets | length')" == 0 ]]
            gh api --method PATCH "$existing_api" \
              -f name="OsaGuard $RELEASE_VERSION" \
              -f body="$release_body" \
              -F draft=true \
              -F prerelease=false \
              --silent
          else
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" \
              >/dev/null 2>&1; then
              echo "$RELEASE_TAG already exists without the reusable draft; refusing it" >&2
              exit 1
            fi
            release_id=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="$RELEASE_TAG" \
              -f target_commitish="$RELEASE_COMMIT" \
              -f name="OsaGuard $RELEASE_VERSION" \
              -f body="$release_body" \
              -F draft=true \
              -F prerelease=false \
              --jq '.id')
          fi
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs:
      - verify
      - prepare-release
    runs-on: macos-14
    timeout-minutes: 75
    # Configure this GitHub Environment with required reviewers and main-only
    # deployment branches before storing signing secrets. The YAML reference
    # alone does not create a protection rule.
    environment: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - target: aarch64-apple-darwin
          - target: x86_64-apple-darwin

    steps:
      - name: Check out immutable source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.verify.outputs.release_commit }}

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: app-tauri/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1d1eb14921d9c2d8ea575663e5fe3a0b57868a05 # 1.89.0
        with:
          components: clippy,rustfmt
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app-tauri/src-tauri

      - name: Install frontend dependencies
        working-directory: app-tauri
        run: npm ci

      - name: Generate release Tauri configuration
        working-directory: app-tauri
        env:
          OSAGUARD_UPDATER_PUBLIC_KEY: ${{ vars.OSAGUARD_UPDATER_PUBLIC_KEY }}
        run: npm run prepare:release-config -- "${{ matrix.target }}"

      - name: Import permanent self-signed release identity
        env:
          OSAGUARD_CODE_SIGNING_P12_BASE64: ${{ secrets.OSAGUARD_CODE_SIGNING_P12_BASE64 }}
          OSAGUARD_CODE_SIGNING_P12_PASSWORD: ${{ secrets.OSAGUARD_CODE_SIGNING_P12_PASSWORD }}
          OSAGUARD_CODE_SIGNING_CERTIFICATE_SHA256: ${{ vars.OSAGUARD_CODE_SIGNING_CERTIFICATE_SHA256 }}
        run: scripts/import-release-signing-identity.sh

      - name: Build and upload certificate-signed release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.verify.outputs.release_version }}
          TAURI_TARGET: ${{ matrix.target }}
          ASSET_ARCH: ${{ matrix.target == 'aarch64-apple-darwin' && 'aarch64' || 'x64' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        working-directory: app-tauri
        shell: bash
        run: |
          set -euo pipefail
          npm run tauri -- build \
            --target "$TAURI_TARGET" \
            --config "src-tauri/gen/tauri.release.${TAURI_TARGET}.conf.json"

          bundle_directory="src-tauri/target/${TAURI_TARGET}/release/bundle"
          find_one() {
            local pattern=$1
            local candidates=()
            local candidate
            while IFS= read -r candidate; do
              candidates+=("$candidate")
            done < <(/usr/bin/find "$bundle_directory" -type f -name "$pattern" -print)
            if [[ ${#candidates[@]} -ne 1 ]]; then
              echo "Expected one $pattern under $bundle_directory; found ${#candidates[@]}" >&2
              return 1
            fi
            printf '%s\n' "${candidates[0]}"
          }

          disk_image=$(find_one '*.dmg')
          updater_archive=$(find_one '*.app.tar.gz')
          updater_signature="${updater_archive}.sig"
          [[ -s "$disk_image" && -s "$updater_archive" && -s "$updater_signature" ]]

          /bin/mkdir release-upload
          /bin/cp "$disk_image" "release-upload/OsaGuard_${RELEASE_VERSION}_${ASSET_ARCH}.dmg"
          /bin/cp "$updater_archive" "release-upload/OsaGuard_${RELEASE_VERSION}_${ASSET_ARCH}.app.tar.gz"
          /bin/cp "$updater_signature" "release-upload/OsaGuard_${RELEASE_VERSION}_${ASSET_ARCH}.app.tar.gz.sig"
          gh release upload "$RELEASE_TAG" release-upload/* --clobber

      - name: Remove temporary release signing keychain
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          cleanup_status=0
          search_list_restored=true
          if ! scripts/restore-release-signing-keychain-search-list.sh; then
            search_list_restored=false
            cleanup_status=1
          fi
          keychain=${OSAGUARD_CODE_SIGNING_KEYCHAIN:-}
          snapshot=${OSAGUARD_CODE_SIGNING_SEARCH_LIST_SNAPSHOT:-}
          keychain_directory=""
          keychain_valid=false
          snapshot_valid=false
          if [[ -n "$keychain" && "$keychain" != "$RUNNER_TEMP"/osaguard-signing.*/release-signing.keychain-db ]]; then
            echo "Refusing to remove an unexpected keychain path" >&2
            cleanup_status=1
          elif [[ -n "$keychain" ]]; then
            keychain_directory=$(dirname -- "$keychain")
            keychain_valid=true
          fi
          if [[ -n "$snapshot" && "$snapshot" != "$RUNNER_TEMP"/osaguard-signing.*/user-search-list.before ]]; then
            echo "Refusing to remove an unexpected search-list snapshot path" >&2
            cleanup_status=1
          elif [[ -n "$snapshot" ]]; then
            snapshot_valid=true
          fi
          if [[ "$search_list_restored" != true ]]; then
            echo "::error::Could not restore the user Keychain search list; preserving temporary signing material for recovery." >&2
            echo "Temporary signing Keychain: $keychain" >&2
            echo "Search-list snapshot: $snapshot" >&2
            echo "Run scripts/restore-release-signing-keychain-search-list.sh with the preserved snapshot before deleting either file." >&2
          elif [[ "$keychain_valid" == true && "$snapshot_valid" == true ]]; then
            if security delete-keychain "$keychain" >/dev/null 2>&1; then
              /bin/rm -f -- "$keychain" "$snapshot"
              /bin/rmdir "$keychain_directory" >/dev/null 2>&1 || true
            else
              echo "::error::Could not delete the temporary signing Keychain after search-list restoration; preserving recovery material." >&2
              cleanup_status=1
            fi
          elif [[ -n "$keychain" || -n "$snapshot" ]]; then
            echo "::error::Incomplete or invalid temporary signing state; preserving recovery material." >&2
            cleanup_status=1
          fi
          exit "$cleanup_status"

  qualify-release:
    name: Qualify release draft
    needs:
      - verify
      - prepare-release
      - build
    runs-on: macos-14
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - name: Check out immutable source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.verify.outputs.release_commit }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Verify exact stable draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.verify.outputs.release_commit }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
          RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          api="repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}"
          release_body=$(gh api "$api" --jq '.body')
          [[ "$(gh api "$api" --jq '.tag_name')" == "$RELEASE_TAG" ]]
          [[ "$(gh api "$api" --jq '.target_commitish')" == "$RELEASE_COMMIT" ]]
          [[ "$(gh api "$api" --jq '.draft')" == "true" ]]
          [[ "$(gh api "$api" --jq '.prerelease')" == "false" ]]
          grep -Fq '**Критически важно:**' <<< "$release_body"
          grep -Fq '**Critical security warning:**' <<< "$release_body"
          grep -Fq 'OsaGuard_' <<< "$release_body"
          grep -Fq 'right-click the app in Finder' <<< "$release_body"
          grep -Fq 'is not notarized by Apple' <<< "$release_body"
          grep -Fq 'saving the password again' <<< "$release_body"

      - name: Download draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          while IFS=$'\t' read -r asset_id asset_name; do
            [[ -n "$asset_id" && "$asset_name" == "$(basename "$asset_name")" && "$asset_name" != .* ]]
            gh api -H 'Accept: application/octet-stream' \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
              > "release-assets/${asset_name}"
            [[ -s "release-assets/${asset_name}" ]]
          done < <(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100" \
            --jq '.[] | [.id, .name] | @tsv')

      - name: Normalize updater metadata to immutable asset URLs
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
        run: |
          node scripts/generate-release-metadata.mjs release-assets "$RELEASE_TAG" "$GITHUB_REPOSITORY"
          node scripts/normalize-release-metadata.mjs release-assets "$RELEASE_TAG" "$GITHUB_REPOSITORY"

      - name: Verify signatures, bundles, and architectures
        env:
          OSAGUARD_UPDATER_PUBLIC_KEY: ${{ vars.OSAGUARD_UPDATER_PUBLIC_KEY }}
          OSAGUARD_CODE_SIGNING_CERTIFICATE_SHA256: ${{ vars.OSAGUARD_CODE_SIGNING_CERTIFICATE_SHA256 }}
          RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
        run: scripts/qualify-release-artifacts.sh release-assets "$RELEASE_TAG" "$GITHUB_REPOSITORY"

      - name: Replace updater metadata and attach checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
          RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            release-assets/latest.json \
            release-assets/CODE_IDENTITIES.txt \
            --clobber
          : > release-assets/SHA256SUMS
          for asset in release-assets/*; do
            [[ "$(basename "$asset")" == SHA256SUMS ]] && continue
            shasum -a 256 "$asset" | sed 's#  release-assets/#  #' >> release-assets/SHA256SUMS
          done
          LC_ALL=C sort -o release-assets/SHA256SUMS release-assets/SHA256SUMS
          gh release upload "$RELEASE_TAG" release-assets/SHA256SUMS --clobber
          for qualified_asset in latest.json CODE_IDENTITIES.txt SHA256SUMS; do
            asset_id=$(gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100" \
              --jq ".[] | select(.name == \"$qualified_asset\") | .id")
            [[ "$asset_id" =~ ^[0-9]+$ ]]
            uploaded_asset="$RUNNER_TEMP/osaguard-uploaded-${qualified_asset}"
            gh api -H 'Accept: application/octet-stream' \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
              > "$uploaded_asset"
            cmp "release-assets/$qualified_asset" "$uploaded_asset"
          done

      - name: Record verified draft handoff
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Qualified OsaGuard release draft"
            echo
            echo "Both macOS architectures, Tauri updater signatures, metadata, checksums, and code identities passed qualification."
            echo "The release remains a draft. Review its assets, then manually dispatch Publish qualified release from main with the exact tag and acknowledgement."
            echo "Draft tag: $RELEASE_TAG"
          } >> "$GITHUB_STEP_SUMMARY"
