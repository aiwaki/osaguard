name: Release (blocked)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Reserved for the future Apple-signed release workflow
        required: false
        type: string

permissions:
  contents: read

# OsaGuard intentionally has no public binary channel without an Apple Developer
# ID Application certificate and notarization. Do not add a self-signed or
# ad-hoc fallback here: that would silently weaken the public release boundary.
jobs:
  stable-release-disabled:
    name: Keep incomplete stable channel closed
    runs-on: ubuntu-latest
    steps:
      - name: Explain the release gate
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::Stable binary release publication is disabled until Developer ID signing, hardened runtime, notarization, and stapling are implemented with Apple-issued credentials."
          exit 1
