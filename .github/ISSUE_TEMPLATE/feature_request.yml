name: Feature request
description: Suggest a user-facing or developer improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem before proposing a solution. OsaGuard will not hide the same-user risk of automatic administrator confirmation.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is difficult today, and who experiences it?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should a successful experience look like?
    validations:
      required: true
  - type: dropdown
    id: audience
    attributes:
      label: Primary audience
      options:
        - Beginner release user
        - Advanced release user
        - Developer or contributor
        - Security researcher
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and privacy impact
      description: Could this change password handling, Accessibility, process recognition, installation, updates, or the automatic-confirmation warning?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Include workarounds or simpler approaches.
